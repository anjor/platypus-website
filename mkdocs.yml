site_name: Platypus Technologies
site_url: https://platypustech.xyz/
site_description: We help technology companies build and run Forward Deployed Engineering functions.

theme:
  name: material
  palette:
    scheme: default
  features:
    - navigation.instant
    - navigation.tracking

nav:
  - Home: index.md
  - Engagements: engagements.md
  - The Blueprint: blueprint.md
  - Team: team.md
  - Writing: https://anjor.xyz/writing

copyright: Copyright &copy; 2026 Platypus Technologies Ltd

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/anjor
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/anjor-kanekar

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - tables
